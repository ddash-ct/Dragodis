[build-system]
requires = [
    "setuptools >=61.2,<70.0",
    "wheel",
]

[project]
name = "dragodis"
description = "A universal interface for running scripts under multiple disassemblers."
authors = [
    {name = "DC3", email = "dc3.tsd@us.af.mil"},
]
keywords = ["malware", "ida", "idapro", "ghidra", "vivisect", "disassembler"]
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE.txt"}
dynamic = ["version"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">= 3.9"
dependencies = [
    "bytesparse",
    "capstone",
    "dynaconf",
    "platformdirs",
    "rpyc",
    "pyhidra>=0.4.0",
    "pywin32; platform_system == 'Windows'",
    "pefile",
    "pyelftools",
    "typing-extensions",
    "vivisect",
]

[project.optional-dependencies]
testing = [
    "pytest>=3.0.0",
    "pytest-datadir",
]

[project.urls]
Homepage = "https://github.com/dod-cyber-crime-center/dragodis"
Repository = "https://github.com/dod-cyber-crime-center/dragodis.git"
Changelog = "https://github.com/dod-cyber-crime-center/dragodis/blob/master/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
dragodis = ["config/settings.toml"]

[tool.setuptools.dynamic]
version = {attr = "dragodis.__version__"}

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "docs",
]
required_plugins = [
    "pytest-datadir",
]
addopts = """
    --doctest-glob="*.rst"
    --doctest-continue-on-failure
    -p no:faulthandler
"""
markers = [
    "ida: tests that use IDA with rpyc",
    "idalib: tests that use IDA with idalib",
    "ghidra: tests that use Ghidra",
    "vivisect: tests that use Vivisect",
    "x86: tests x86 sample",
    "arm: tests ARM sample",
]
